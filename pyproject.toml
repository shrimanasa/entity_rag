[project]
name = "entity-aware-rag"
version = "0.1.0"
description = "Entity-Aware Retrieval for Materials-Science RAG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.5.0",
    "networkx>=3.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-aware-rag"
version = "0.1.0"
description = "Entity-Aware Retrieval for Materials-Science RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.7.2",
    "networkx==3.5",
    "scipy==1.16.3",
    "numpy==2.3.5",
    "matplotlib==3.10.6",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.1.0",
    "torch==2.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
